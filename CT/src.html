<title>CTD</title>
<style>
  body { margin:0; background:#f7f7f9; color:#262626; display:flex;
         min-height:100vh; align-items:center; justify-content:center;
         font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .card { background:#fff; border:1px solid #d9d9e3; border-radius:10px;
          padding:30px 34px; width:320px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  h1 { font-size:16px; color:#4C72B0; margin:0 0 16px; }
  input[type=password] { width:100%; box-sizing:border-box; padding:8px 10px;
          border:1px solid #c9c9d6; border-radius:6px; font-size:14px; }
  input[type=password]:focus { outline:2px solid #4C72B0; border-color:#4C72B0; }
  label.rm { display:flex; gap:7px; align-items:center; margin:12px 0 0;
             font-size:12.5px; color:#6b6b6b; }
  button { margin-top:14px; width:100%; padding:8px; background:#4C72B0;
           color:#fff; border:none; border-radius:6px; font-size:14px;
           font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:#b22222; font-size:12.5px; min-height:18px; margin-top:10px; }
</style>

const err = m => document.getElementById("err").textContent = m;
async function tryOpen(pwd, remember) {
  if (!window.crypto || !crypto.subtle) { err("needs https"); return false; }
  const raw = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  try {
    const km = await crypto.subtle.importKey("raw",
      new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    if (remember) { try { localStorage.setItem("ct_pw", pwd); } catch (e) {} }
    else { try { localStorage.removeItem("ct_pw"); } catch (e) {} }
    document.open();
    document.write(new TextDecoder().decode(pt));
    document.close();
    return true;
  } catch (e) { return false; }
}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault(); err("");
  const b = document.getElementById("go");
  b.disabled = true; b.textContent = "decrypting\u2026";
  const ok = await tryOpen(document.getElementById("pw").value,
                           document.getElementById("rm").checked);
  if (!ok) { err("wrong password"); b.disabled = false; b.textContent = "open"; }
});
(async () => {
  let saved = null;
  try { saved = localStorage.getItem("ct_pw"); } catch (e) {}
  if (saved) await tryOpen(saved, true);
})();
